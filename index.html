<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extintor · NEXBRIG</title>
<style>
:root{--bg:#f3f1ee;--card:#fff;--ink:#1d1a19;--mut:#6f6762;--line:#e0dbd6;--red:#b3261e;--ok:#1f7a45;--warn:#b26a00;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161413;--card:#201d1c;--ink:#f1ece8;--mut:#a39b95;--line:#3a3532;--red:#ef6a5f;--ok:#4cc180;--warn:#f0a63a;--bad:#ff7a70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
header{--lw:min(150px,26vw);display:grid;grid-template-columns:var(--lw) 1fr var(--lw);align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:4px solid var(--red)}
header img{width:var(--lw);height:76px;padding:6px;object-fit:contain;object-position:center;background:#fff;border-radius:8px}
header span{min-width:0;text-align:center;font-size:clamp(1rem,3.6vw,1.6rem);font-weight:700;line-height:1.2;letter-spacing:.2px;overflow-wrap:anywhere}
main{transition:max-width .3s ease;max-width:640px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h1{margin:0 0 2px;font-size:1.5rem;line-height:1.2}
.id,.hint{color:var(--mut);font-size:.9rem}
.est{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:6px;font-weight:600;color:#fff}
.est.ok{background:var(--ok)}.est.warn{background:var(--warn)}.est.bad{background:var(--bad)}.est.sin{background:var(--mut)}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:8px 16px}
dt{color:var(--mut)}dd{margin:0;font-weight:500;overflow-wrap:anywhere}
h2{font-size:1.05rem;margin:0 0 10px}
.mp{position:relative}
.mp img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 2px var(--red)}
a.item{display:block;color:inherit;text-decoration:none;padding:10px 0;border-bottom:1px solid var(--line)}
a.item:last-child{border:0}a.item small{display:block;color:var(--mut)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
footer{display:flex;justify-content:center;align-items:center;color:var(--mut);font-size:.85rem;padding:8px}
a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.pdf{width:100%;padding:12px;margin-bottom:10px;border:0;border-radius:8px;background:var(--red);color:#fff;font:600 1rem inherit;font-family:inherit;cursor:pointer}
.pdf:disabled{opacity:.6;cursor:wait}
.pdf:focus-visible,.acts button:focus-visible,.oculto:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.oculto{background:none;border:0;color:inherit;opacity:.75;cursor:pointer;padding:0 4px;font-size:2rem;line-height:1}
.oculto:hover,.oculto:focus-visible{opacity:.8}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:16px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog label{display:block;font-weight:600;margin:8px 0 3px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button,.acts a{flex:1;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:center;text-decoration:none}
.acts .p{background:var(--red);color:#fff;border-color:var(--red)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
/* Navegación Extintores / Planos */
.nav{display:flex;gap:6px;margin-bottom:14px}
.nav a{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600}
.nav a.on{background:var(--red);border-color:var(--red);color:#fff}
.nav a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* Planos */
main.ancho{max-width:1100px}
.ptabs{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ptabs>span{color:var(--mut);font-size:.9rem;font-weight:600;margin-right:2px}
.ptabs button{position:relative;min-width:44px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 1rem inherit;font-family:inherit;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.ptabs button:hover{border-color:var(--red)}
.ptabs button[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.ptabs button i{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card)}
.ptabs i.warn{background:var(--warn)}.ptabs i.bad{background:var(--bad)}
.ptabs button:focus-visible,.zb button:focus-visible,.chip:focus-visible,.fila:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#pl.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{margin:0;font-size:1.25rem}.ph .hint{margin:2px 0 0}
.zb{display:flex;gap:6px;align-items:center}
.zb button{min-width:40px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.zb button:hover{border-color:var(--red)}
.zb output{min-width:48px;text-align:center;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums}
.pg{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.pv{min-width:0}
.pv.fs{position:fixed;inset:0;z-index:50;background:var(--card);padding:calc(12px + env(safe-area-inset-top,0)) 12px calc(12px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.pv.fs .zb{justify-content:flex-end;margin-bottom:8px}
.pv.fs .zw{flex:1;max-height:none}
.zw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;overscroll-behavior:contain}
.zw.z{max-height:72vh;cursor:grab}.zw.g{cursor:grabbing;user-select:none}
.zw .mp{margin:0 auto}
.zw .mp img{border:0;border-radius:0;-webkit-user-drag:none;user-select:none}
.pside{display:flex;flex-direction:column;gap:10px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:.85rem inherit;font-family:inherit;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.chip.ok i{background:var(--ok)}.chip.warn i{background:var(--warn)}.chip.bad i{background:var(--bad)}.chip.sin i{background:var(--mut)}
.fl{display:flex;flex-direction:column;max-height:calc(72vh - 44px);overflow:auto;border:1px solid var(--line);border-radius:8px}
.fila{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:none}
.fila:last-child{border-bottom:0}
.fila:hover,.fila.sel{background:var(--bg)}
.fila.sel{box-shadow:inset 3px 0 0 var(--red)}
.fila>i{flex:none;width:12px;height:12px;border-radius:50%}
.fila>span{min-width:0;flex:1}
.fila b,.fila small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila small{color:var(--mut);font-size:.8rem}
.fila.ok>i{background:var(--ok)}.fila.warn>i{background:var(--warn)}.fila.bad>i{background:var(--bad)}.fila.sin>i{background:var(--mut)}
.fila.sp>i{background:none;border:2px dashed var(--mut)}
.fila[hidden],.pin[hidden]{display:none}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.45),0 1px 4px rgba(0,0,0,.4);cursor:pointer;transition:transform .15s}
.pin::after{content:"";position:absolute;inset:-10px}
.pin:hover,.pin:focus-visible{transform:scale(1.3);z-index:2}
.pin:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pin.ok{background:var(--ok)}.pin.warn{background:var(--warn)}.pin.bad{background:var(--bad)}.pin.sin{background:var(--mut)}
.pin.bad{animation:pulso 2s infinite}
.pin.sel{transform:scale(1.5);z-index:3;animation:sel 1s 3}
@keyframes pulso{0%{box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 0 2px rgba(179,38,30,.6)}70%,100%{box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 0 12px rgba(179,38,30,0)}}
@keyframes sel{0%,100%{box-shadow:0 0 0 2px #000,0 0 0 6px rgba(255,255,255,.9)}50%{box-shadow:0 0 0 2px #000,0 0 0 14px rgba(179,38,30,.35)}}
.ley{margin:10px 0 0;color:var(--mut);font-size:.8rem}
@media(max-width:820px){.pg{grid-template-columns:1fr}.fl{max-height:320px}.zw.z{max-height:65vh}}
@media(prefers-reduced-motion:reduce){.pin,#pl.fade{animation:none!important;transition:none}}
</style>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<header><img id="logo" alt="Logo"><span id="hn">Control de extintores</span></header>
<main id="app"><p>Cargando información…</p></main>
<footer><button id="cfgBtn" class="oculto" aria-label="Configuración" title="Configuración">·</button><span>Servicio por <a href="https://nexbrig.com" style="color:inherit">NEXBRIG</a></span></footer>
<dialog id="dlg"></dialog>
<dialog id="dx" aria-label="Datos del extintor"></dialog>
<script>
/* Valores por defecto. Para cambiarlos NO hace falta editar este código:
   usa el botón oculto «·» del pie de página (pide contraseña) y genera un config.json. */
const DEF = {usuario:"matiasvargas-pixel", repo:"2manue", rama:"main", carpeta:"data", fuente:"raw", logo:"https://nexbrig.com/img/novologo.jpeg"};
const HASH = "ab9f273897be0befedd52dce825cd30810a22f61654d00581f59e20abadbe12b"; // SHA-256 de la contraseña

const $ = s => document.querySelector(s), app = $("#app");
let CFG = {...DEF}, DB = null, EMP = {}, E = "";
const base = (c = CFG) => c.fuente === "pages"
  ? `https://${c.usuario}.github.io/${c.repo}/${c.carpeta}/`
  : `https://raw.githubusercontent.com/${c.usuario}/${c.repo}/${c.rama}/${c.carpeta}/`;
const ruta = p => base() + encodeURIComponent(E) + "/" + p.split("/").map(encodeURIComponent).join("/");
const getJson = async u => { const r = await fetch(u + "?t=" + Date.now(), {cache: "no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd = d => d ? new Date(d + "T00:00:00").toLocaleDateString("es-PE", {day:"numeric", month:"long", year:"numeric"}) : "";
const enlace = id => "?e=" + encodeURIComponent(E) + (id ? "&id=" + encodeURIComponent(id) : "");

function fh(h){ // "14:30" -> "2:30 PM"
  if(!h) return "";
  const [H, M] = h.split(":").map(Number);
  return (H % 12 || 12) + ":" + String(M).padStart(2, "0") + " " + (H < 12 ? "AM" : "PM");
}
function dur(ms){
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return d > 0 ? d + " d " + h + " h" : h > 0 ? h + " h " + m + " min" : Math.max(m, 1) + " min";
}
// Compara con la fecha y hora del dispositivo. Sin hora, vence al terminar ese día (23:59:59).
function estado(v, hora){
  if(!v) return ["sin", "Sin fecha de vencimiento"];
  const ms = new Date(v + "T" + (hora || "23:59:59")) - Date.now();
  if(isNaN(ms)) return ["sin", "Fecha de vencimiento no válida"];
  if(ms < 0) return ["bad", "Vencido hace " + dur(-ms)];
  if(ms <= 30 * 864e5) return ["warn", "Por vencer: faltan " + dur(ms)];
  return ["ok", "Vigente · faltan " + dur(ms)];
}

const enlacePlanos = () => "?e=" + encodeURIComponent(E) + "&vista=planos";
const navegacion = act => `<nav class="nav" aria-label="Secciones">
  <a href="${enlace()}" ${act === "lista" ? 'class="on" aria-current="page"' : ""}>Extintores</a>
  <a href="${enlacePlanos()}" ${act === "planos" ? 'class="on" aria-current="page"' : ""}>Planos</a></nav>`;

function filasExtintor(e){
  return [
    ["Tipo", e.tipo], ["Capacidad", e.capacidad], ["Marca", e.marca], ["N° de serie", e.serie],
    ["Ubicación", e.ubicacion], ["Fabricación", fd(e.fabricacion)], ["Última recarga", fd(e.recarga)],
    ["Vencimiento", e.vencimiento ? fd(e.vencimiento) + (e.horaVenc ? ", " + fh(e.horaVenc) : "") : ""],
    ["Responsable", e.responsable], ["Observaciones", e.notas], ["Actualizado", fd(e.actualizado)]
  ].filter(r => r[1]);
}

function vistaExtintor(e){
  const [cls, txt] = estado(e.vencimiento, e.horaVenc);
  const filas = filasExtintor(e);
  let h = `<div class="card"><h1>${esc(e.nombre || e.id)}</h1><div class="id">Código ${esc(e.id)}</div>
    <div class="est ${cls}" id="est">${esc(txt)}</div></div>
    <div class="card"><dl>${filas.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl></div>`;
  // El mapa es un archivo SVG de la carpeta de la empresa; se muestra como imagen (no ejecuta scripts).
  if(e.mapa && /^[\w\-./]+\.svg$/i.test(e.mapa) && !e.mapa.includes("..")){
    const punto = e.mapaX != null && e.mapaY != null && e.mapaX !== "" && e.mapaY !== "";
    h += `<div class="card"><h2>Mapa de ubicación</h2><div class="mp"><img src="${esc(ruta(e.mapa))}" alt="Mapa de ubicación del extintor ${esc(e.id)}">
      ${punto ? `<i class="dot" style="left:${+e.mapaX}%;top:${+e.mapaY}%"></i>` : ""}</div>
      ${punto ? '<p class="hint">El punto rojo indica dónde está el extintor.</p>' : ""}</div>`;
  }
  return h + `<div class="card"><button class="pdf" onclick="generarPDF(this)">Descargar informe PDF de todos los extintores</button>
    <a class="item" href="${enlace()}">Ver todos los extintores</a>
    <a class="item" href="${enlacePlanos()}">Ver planos de la empresa</a></div>`;
}

/* ---------- Planos: todos los mapas de la empresa con sus extintores ---------- */
const mapaValido = m => typeof m === "string" && /^[\w\-./]+\.svg$/i.test(m) && !m.includes("..");
const tienePunto = e => [e.mapaX, e.mapaY].every(v => v != null && v !== "" && isFinite(+v));
const nombrePlano = p => { const n = p.split("/").pop().replace(/\.svg$/i, "").replace(/[-_]+/g, " ").trim(); return n.charAt(0).toUpperCase() + n.slice(1); };
const dx = $("#dx");

function abrirExtintor(id){
  const e = (DB.extintores || []).find(x => x.id === id); if(!e) return;
  const [c, t] = estado(e.vencimiento, e.horaVenc);
  dx.innerHTML = `<h2 style="margin:0;font-size:1.3rem">${esc(e.nombre || e.id)}</h2><div class="id">Código ${esc(e.id)}</div>
    <div class="est ${c}">${esc(t)}</div>
    <dl style="margin-top:14px">${filasExtintor(e).map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
    <div class="acts"><button id="dxc">Cerrar</button><a class="p" href="${enlace(e.id)}">Ver ficha completa</a></div>`;
  dx.showModal(); $("#dxc").onclick = () => dx.close();
}
dx.onclick = ev => { // clic fuera del cuadro lo cierra
  const r = dx.getBoundingClientRect();
  if(ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) dx.close();
};

const ETQ = {ok: "Vigente", warn: "Por vencer", bad: "Vencido", sin: "Sin fecha"};
let PL = [], PI = 0, OFF = new Set(), SEL = "";
const zoomActual = () => parseFloat($("#mp").style.width) || 100;

function vistaPlanos(db){
  const ex = db.extintores || [];
  PL = [...new Set([...(Array.isArray(EMP.mapas) ? EMP.mapas : []), ...ex.map(e => e.mapa)].filter(mapaValido))];
  const sinPlano = ex.filter(e => !mapaValido(e.mapa));
  const n = parseInt(new URLSearchParams(location.search).get("p")) - 1;
  PI = n >= 0 && n < PL.length ? n : 0;
  app.className = "ancho";
  let h = navegacion("planos");
  if(!PL.length) h += `<div class="card"><h2>Planos</h2><p>Esta empresa aún no tiene planos cargados.</p></div>`;
  else{
    const peor = p => { const s = ex.filter(e => e.mapa === p).map(e => estado(e.vencimiento, e.horaVenc)[0]); return s.includes("bad") ? "bad" : s.includes("warn") ? "warn" : ""; };
    h += `<div class="card plano">` + (PL.length > 1 ? `<div class="ptabs" role="tablist" aria-label="Planos de la empresa"><span>Plano</span>` +
      PL.map((p, i) => `<button role="tab" data-p="${i}" title="${esc(nombrePlano(p))}" aria-selected="${i === PI}">${i + 1}${peor(p) ? `<i class="${peor(p)}"></i>` : ""}</button>`).join("") + `</div>` : "") +
      `<div id="pl" role="tabpanel"></div></div>`;
  }
  if(sinPlano.length) h += `<div class="card"><h2>Sin plano asignado</h2>${sinPlano.map(e => `<a class="item" href="${enlace(e.id)}"><b>${esc(e.id)}</b> · ${esc(e.nombre)}<small>${esc(e.ubicacion)}</small></a>`).join("")}</div>`;
  app.innerHTML = h;
  if(PL.length) pintarPlano(false);
}

function pintarPlano(anim = true){
  const p = PL[PI], ex = DB.extintores || [];
  const en = ex.filter(e => e.mapa === p).map(e => ({e, c: estado(e.vencimiento, e.horaVenc)}));
  const con = en.filter(x => tienePunto(x.e)), sin = en.filter(x => !tienePunto(x.e));
  const cuenta = k => en.filter(x => x.c[0] === k).length;
  const fila = (x, tag, extra) => `<${tag} class="fila ${x.c[0]}${extra}" data-id="${esc(x.e.id)}" data-c="${x.c[0]}"${tag === "a" ? ` href="${enlace(x.e.id)}"` : ""}><i></i><span><b>${esc(x.e.id)} · ${esc(x.e.nombre || "")}</b><small>${esc(x.e.ubicacion || x.c[1])}</small></span></${tag}>`;
  $("#pl").className = anim ? "fade" : "";
  $("#pl").innerHTML = `<div class="ph"><div><h2>${esc(nombrePlano(p))}</h2>
      <p class="hint">${PL.length > 1 ? `Plano ${PI + 1} de ${PL.length} · ` : ""}${con.length} extintor${con.length === 1 ? "" : "es"} marcado${con.length === 1 ? "" : "s"}. Toca un punto para ver sus datos.</p></div></div>
    <div class="pg"><div class="pv" id="pv">
      <div class="zb" role="group" aria-label="Controles del plano"><button data-z="-" aria-label="Alejar">−</button><output id="zl" aria-live="polite">100%</output><button data-z="+" aria-label="Acercar">+</button><button data-z="0">Restablecer</button><button data-fs aria-label="Pantalla completa" title="Pantalla completa">⛶</button></div>
      <div class="zw" id="zw"><div class="mp" id="mp" style="width:100%"><img src="${esc(ruta(p))}" alt="Plano ${esc(nombrePlano(p))}" draggable="false">
        ${con.map(x => `<button class="pin ${x.c[0]}" style="left:${+x.e.mapaX}%;top:${+x.e.mapaY}%" data-id="${esc(x.e.id)}" data-c="${x.c[0]}" title="${esc(x.e.id + " · " + x.c[1])}" aria-label="${esc("Extintor " + x.e.id + ": " + (x.e.nombre || "") + ". " + x.c[1])}"></button>`).join("")}
      </div></div><p class="ley">Doble clic o Ctrl + rueda para acercar. Arrastra para mover el plano.</p></div>
    <aside class="pside"><div class="chips" role="group" aria-label="Filtrar por estado">${["bad", "warn", "ok", "sin"].filter(k => cuenta(k)).map(k => `<button class="chip ${k}" data-f="${k}" aria-pressed="true"><i></i>${ETQ[k]} <b>${cuenta(k)}</b></button>`).join("")}</div>
      <div class="fl">${con.map(x => fila(x, "button", "")).join("")}${sin.map(x => fila(x, "a", " sp")).join("")}${en.length ? "" : `<p class="hint" style="padding:12px;margin:0">No hay extintores en este plano.</p>`}</div>
      ${sin.length ? `<p class="hint" style="margin:0">Los de borde punteado están asignados a este plano pero sin punto marcado.</p>` : ""}</aside></div>`;
  OFF.clear(); SEL = "";
}

function cambiarPlano(i){
  if(i === PI || i < 0 || i >= PL.length) return;
  PI = i;
  app.querySelectorAll(".ptabs [data-p]").forEach(b => b.setAttribute("aria-selected", +b.dataset.p === i));
  pintarPlano();
  try{ history.replaceState(null, "", enlacePlanos() + "&p=" + (i + 1)); }catch(e){}
}

function zoom(v, ox, oy){
  const zw = $("#zw"), mp = $("#mp"), a = zoomActual();
  v = Math.max(25, Math.min(500, Math.round(v)));
  ox = ox ?? zw.clientWidth / 2; oy = oy ?? zw.clientHeight / 2;
  const k = v / a;
  mp.style.width = v + "%";
  zw.scrollLeft = (zw.scrollLeft + ox) * k - ox; zw.scrollTop = (zw.scrollTop + oy) * k - oy;
  zw.classList.toggle("z", v > 100); $("#zl").textContent = v + "%";
}

function elegir(id){ // resalta el extintor en el plano y en la lista; con el segundo toque abre sus datos
  if(SEL === id) return abrirExtintor(id);
  SEL = id;
  app.querySelectorAll(".pin.sel,.fila.sel").forEach(x => x.classList.remove("sel"));
  const pin = app.querySelector(`.pin[data-id="${CSS.escape(id)}"]`), fl = app.querySelector(`.fila[data-id="${CSS.escape(id)}"]`);
  if(fl) fl.classList.add("sel");
  if(!pin || pin.hidden) return;
  pin.classList.add("sel");
  const zw = $("#zw");
  zw.scrollTo({left: pin.offsetLeft - zw.clientWidth / 2, top: pin.offsetTop - zw.clientHeight / 2, behavior: "smooth"});
  if(zw.scrollHeight <= zw.clientHeight) $("#pv").scrollIntoView({block: "nearest", behavior: "smooth"});
}

function navegar(vista, push = true){
  if(push) history.pushState(null, "", vista === "planos" ? enlacePlanos() : enlace());
  const pintar = () => { document.body.style.overflow = ""; vista === "planos" ? vistaPlanos(DB) : vistaLista(DB); window.scrollTo(0, 0); };
  if(document.startViewTransition && !matchMedia("(prefers-reduced-motion:reduce)").matches) document.startViewTransition(pintar);
  else{ pintar(); app.animate([{opacity: 0, transform: "translateY(8px)"}, {opacity: 1, transform: "none"}], {duration: 250, easing: "ease-out"}); }
}
window.addEventListener("popstate", () => { // botón Atrás / Adelante del navegador
  if(!DB) return; const q = new URLSearchParams(location.search);
  if(q.get("id")) return location.reload();
  navegar(q.get("vista") === "planos" ? "planos" : "lista", false);
});

// Un solo manejador para pestañas, zoom, filtros, lista y puntos
app.addEventListener("click", ev => {
  const nv = ev.target.closest(".nav a"); // Extintores / Planos sin recargar la página
  if(nv && DB && !ev.metaKey && !ev.ctrlKey && !ev.shiftKey && ev.button === 0){
    ev.preventDefault(); if(!nv.classList.contains("on")) navegar(nv.getAttribute("href").includes("vista=planos") ? "planos" : "lista"); return;
  }
  const t = ev.target, tab = t.closest("[data-p]"), z = t.closest("[data-z]"), f = t.closest("[data-f]");
  if(tab) return cambiarPlano(+tab.dataset.p);
  if(z) return zoom(z.dataset.z === "0" ? 100 : zoomActual() + (z.dataset.z === "+" ? (zoomActual() >= 100 ? 50 : 25) : (zoomActual() > 100 ? -50 : -25)));
  if(t.closest("[data-fs]")){ const pv = $("#pv"), on = pv.classList.toggle("fs"); document.body.style.overflow = on ? "hidden" : ""; return; }
  if(f){
    const k = f.dataset.f, off = !OFF.has(k); off ? OFF.add(k) : OFF.delete(k);
    f.setAttribute("aria-pressed", !off);
    app.querySelectorAll(`.pin[data-c="${k}"],.fila[data-c="${k}"]`).forEach(x => x.hidden = off);
    return;
  }
  const fila = t.closest("button.fila"); if(fila) return elegir(fila.dataset.id);
  const pin = t.closest(".pin[data-id]"); if(pin) abrirExtintor(pin.dataset.id);
});
app.addEventListener("keydown", ev => { // flechas para cambiar de plano
  if(!ev.target.closest(".ptabs") || !/^Arrow(Left|Right)$/.test(ev.key)) return;
  cambiarPlano(PI + (ev.key === "ArrowRight" ? 1 : -1));
  app.querySelector(`.ptabs [data-p="${PI}"]`).focus();
});
document.addEventListener("keydown", ev => { const pv = $("#pv"); if(ev.key === "Escape" && pv && pv.classList.contains("fs")){ pv.classList.remove("fs"); document.body.style.overflow = ""; } });
app.addEventListener("wheel", ev => { // Ctrl + rueda (o pellizco en trackpad) acerca el plano
  const zw = ev.target.closest(".zw"); if(!zw || !ev.ctrlKey) return;
  ev.preventDefault(); const r = zw.getBoundingClientRect();
  zoom(zoomActual() * (ev.deltaY < 0 ? 1.15 : 1 / 1.15), ev.clientX - r.left, ev.clientY - r.top);
}, {passive: false});
app.addEventListener("dblclick", ev => {
  const zw = ev.target.closest(".zw"); if(!zw || ev.target.closest(".pin")) return;
  const r = zw.getBoundingClientRect(); zoom(zoomActual() !== 100 ? 100 : 250, ev.clientX - r.left, ev.clientY - r.top);
});
let arr = null; // arrastrar con el mouse para mover el plano ampliado
app.addEventListener("pointerdown", ev => {
  const zw = ev.target.closest(".zw");
  if(!zw || ev.pointerType !== "mouse" || ev.button || ev.target.closest(".pin") || !zw.classList.contains("z")) return;
  arr = {zw, x: ev.clientX, y: ev.clientY, l: zw.scrollLeft, t: zw.scrollTop}; zw.classList.add("g");
});
document.addEventListener("pointermove", ev => { if(arr){ arr.zw.scrollLeft = arr.l - (ev.clientX - arr.x); arr.zw.scrollTop = arr.t - (ev.clientY - arr.y); } });
document.addEventListener("pointerup", () => { if(arr){ arr.zw.classList.remove("g"); arr = null; } });

function vistaLista(db){
  app.className = "";
  app.innerHTML = navegacion("lista") + `<div class="card"><h2>Extintores registrados</h2>
    <button class="pdf" onclick="generarPDF(this)">Descargar informe PDF</button>
    <input id="q" type="search" placeholder="Buscar por código, nombre o ubicación"><div id="lista"></div></div>`;
  const pintar = () => {
    const q = $("#q").value.toLowerCase();
    const r = db.extintores.filter(e => (e.id + " " + e.nombre + " " + e.ubicacion).toLowerCase().includes(q));
    $("#lista").innerHTML = r.map(e =>
      `<a class="item" href="${enlace(e.id)}"><b>${esc(e.id)}</b> · ${esc(e.nombre)}<small>${esc(e.ubicacion)}</small></a>`).join("") || "<p>No hay resultados.</p>";
  };
  $("#q").oninput = pintar; pintar();
}

/* ---------- Informe PDF ---------- */
function logoData(urls){
  const probar = u => new Promise(res => {
    const i = new Image(); i.crossOrigin = "anonymous";
    i.onload = () => { try{
      const c = document.createElement("canvas"); c.width = i.naturalWidth; c.height = i.naturalHeight;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(i, 0, 0);
      res({url: c.toDataURL("image/jpeg", .92), w: i.naturalWidth, h: i.naturalHeight});
    }catch(e){ res(null); } };
    i.onerror = () => res(null); i.src = u;
  });
  return urls.filter(Boolean).reduce((p, u) => p.then(r => r || probar(u)), Promise.resolve(null));
}

async function generarPDF(btn){
  if(!window.jspdf || !DB) return alert("No se pudo cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.");
  const txtBtn = btn.textContent; btn.disabled = true; btn.textContent = "Generando informe…";
  try{
    const doc = new window.jspdf.jsPDF({orientation: "landscape", unit: "mm", format: "a4"});
    const W = doc.internal.pageSize.getWidth(), now = new Date(), p = n => String(n).padStart(2, "0");
    const fecha = now.toLocaleDateString("es-PE", {day: "numeric", month: "long", year: "numeric"});
    const hora = fh(p(now.getHours()) + ":" + p(now.getMinutes()));
    const lg = await logoData([EMP.logo, CFG.logo]);
    if(lg){ let h = 20, w = h * lg.w / lg.h; if(w > 60){ w = 60; h = w * lg.h / lg.w; } doc.addImage(lg.url, "JPEG", 14, 10, w, h); }
    doc.setTextColor(29, 26, 25); doc.setFont("helvetica", "bold"); doc.setFontSize(18);
    doc.text("Informe de estado de extintores", W - 14, 17, {align: "right"});
    doc.setFontSize(12); doc.text(EMP.nombre || "", W - 14, 24, {align: "right"});
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90);
    doc.text("Generado el " + fecha + ", " + hora, W - 14, 30, {align: "right"});
    doc.setDrawColor(179, 38, 30); doc.setLineWidth(0.8); doc.line(14, 36, W - 14, 36);

    const orden = {bad: 0, warn: 1, sin: 2, ok: 3};
    const filas = DB.extintores.map(e => {
      const [c, t] = estado(e.vencimiento, e.horaVenc);
      return {c, row: [e.id, e.nombre || "", e.tipo || "", e.capacidad || "", e.ubicacion || "",
        e.vencimiento ? fd(e.vencimiento) + (e.horaVenc ? ", " + fh(e.horaVenc) : "") : "—", t]};
    }).sort((a, b) => orden[a.c] - orden[b.c]);
    const n = k => filas.filter(f => f.c === k).length;
    doc.setFontSize(11); doc.setTextColor(29, 26, 25);
    doc.text("Total: " + filas.length + "   |   Vigentes: " + n("ok") + "   |   Por vencer: " + n("warn") +
      "   |   Vencidos: " + n("bad") + (n("sin") ? "   |   Sin fecha: " + n("sin") : ""), 14, 43);

    const color = {ok: [31, 122, 69], warn: [178, 106, 0], bad: [179, 38, 30], sin: [111, 103, 98]};
    doc.autoTable({
      startY: 48,
      head: [["Código", "Nombre", "Tipo", "Capacidad", "Ubicación", "Vencimiento", "Estado"]],
      body: filas.map(f => f.row),
      styles: {fontSize: 9, cellPadding: 2.5},
      headStyles: {fillColor: [179, 38, 30], textColor: 255},
      alternateRowStyles: {fillColor: [247, 245, 243]},
      didParseCell: d => {
        if(d.section === "body" && d.column.index === 6){
          d.cell.styles.fillColor = color[filas[d.row.index].c]; d.cell.styles.textColor = 255; d.cell.styles.fontStyle = "bold";
        }
      }
    });
    const pags = doc.internal.getNumberOfPages(), H = doc.internal.pageSize.getHeight();
    for(let i = 1; i <= pags; i++){
      doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
      doc.text("Servicio por NEXBRIG · nexbrig.com", 14, H - 8);
      doc.text("Página " + i + " de " + pags, W - 14, H - 8, {align: "right"});
    }
    doc.save("Informe-extintores-" + E + "-" + now.getFullYear() + "-" + p(now.getMonth() + 1) + "-" + p(now.getDate()) + ".pdf");
  }catch(err){
    alert("No se pudo generar el PDF.");
  }finally{
    btn.disabled = false; btn.textContent = txtBtn;
  }
}

/* ---------- Panel de configuración oculto (con contraseña) ---------- */
const dlg = $("#dlg");
const sha = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(x => x.toString(16).padStart(2, "0")).join("");

function abrirPanel(){
  dlg.innerHTML = `<h2>Acceso</h2><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="off">
    <p class="hint" id="msg" role="alert"></p>
    <div class="acts"><button id="no">Cancelar</button><button class="p" id="ok">Entrar</button></div>`;
  dlg.showModal(); $("#pw").focus();
  $("#no").onclick = () => dlg.close();
  const entrar = async () => {
    if(!(window.crypto && crypto.subtle)) return $("#msg").textContent = "Abre la página con https para usar este panel.";
    if(await sha($("#pw").value) === HASH) panel(); else { $("#msg").textContent = "Contraseña incorrecta."; $("#pw").select(); }
  };
  $("#ok").onclick = entrar; $("#pw").onkeydown = ev => { if(ev.key === "Enter") entrar(); };
}

function panel(){
  const CAMPOS = [["usuario", "Usuario de GitHub"], ["repo", "Repositorio público de datos"], ["rama", "Rama"], ["carpeta", "Carpeta de datos"], ["logo", "Logo por defecto (URL)"]];
  dlg.innerHTML = `<h2>Configuración</h2>` +
    CAMPOS.map(([k, l]) => `<label>${l}<input data-k="${k}" value="${esc(CFG[k])}"></label>`).join("") +
    `<label>Fuente de datos<select data-k="fuente"><option value="pages">GitHub Pages (recomendado)</option><option value="raw">raw.githubusercontent.com</option></select></label>
    <p class="hint" id="cu"></p>
    <p class="hint">«Guardar aquí» solo aplica en este navegador (para probar). Para que aplique a todos, descarga <b>config.json</b> y súbelo junto a index.html.</p>
    <div class="acts"><button class="p" id="g1">Guardar aquí</button><button id="g2">Descargar config.json</button></div>
    <div class="acts"><button id="g3">Restablecer</button><button id="g4">Cerrar</button></div>`;
  dlg.querySelector("[data-k=fuente]").value = CFG.fuente;
  const leer = () => { const o = {}; dlg.querySelectorAll("[data-k]").forEach(i => o[i.dataset.k] = i.value.trim()); return o; };
  const url = () => $("#cu").textContent = "Datos en: " + base({...CFG, ...leer()}) + "<empresa>/";
  dlg.oninput = url; url();
  $("#g1").onclick = () => { try{ localStorage.setItem("nb_cfg", JSON.stringify(leer())); }catch(e){} location.reload(); };
  $("#g2").onclick = () => {
    const a = document.createElement("a"); a.download = "config.json";
    a.href = URL.createObjectURL(new Blob([JSON.stringify({...CFG, ...leer()}, null, 2)], {type: "application/json"})); a.click();
  };
  $("#g3").onclick = () => { try{ localStorage.removeItem("nb_cfg"); }catch(e){} location.reload(); };
  $("#g4").onclick = () => { dlg.oninput = null; dlg.close(); };
}
/* Hay que pulsar el puntito 10 veces seguidas (con menos de 3 s entre toques) para abrir el acceso */
let toques = 0, tToques;
$("#cfgBtn").onclick = () => {
  clearTimeout(tToques);
  if(++toques >= 10){ toques = 0; abrirPanel(); return; }
  tToques = setTimeout(() => toques = 0, 3000);
};

/* ---------- Arranque ---------- */
const noEnc = (t, m) => app.innerHTML = `<div class="card"><h1>${esc(t)}</h1><p>${m || ""}</p></div>`;
(async () => {
  try{ Object.assign(CFG, await getJson("config.json")); }catch(e){}       // config.json junto al index.html (opcional)
  try{ Object.assign(CFG, JSON.parse(localStorage.getItem("nb_cfg") || "{}")); }catch(e){} // prueba local
  $("#logo").src = CFG.logo;
  const q = new URLSearchParams(location.search); E = q.get("e") || ""; const id = q.get("id");
  if(!E) return noEnc("Control de extintores", "Escanea el código QR de un extintor para ver su información.");
  if(!/^[a-z0-9-]{3,60}$/i.test(E)) return noEnc("Empresa no encontrada");
  try{
    const [emp, db] = await Promise.all([getJson(ruta("empresa.json")).catch(() => ({})), getJson(ruta("extintores.json"))]);
    EMP = emp; DB = db;
    if(emp.logo) $("#logo").src = emp.logo;
    if(emp.nombre){ $("#hn").textContent = emp.nombre; document.title = emp.nombre + " · Extintores"; }
    if(!id) return q.get("vista") === "planos" ? vistaPlanos(db) : vistaLista(db);
    const e = (db.extintores || []).find(x => x.id === id);
    if(!e) return noEnc("Extintor no encontrado", `El código <b>${esc(id)}</b> no existe. <a href="${enlace()}">Ver todos</a>`);
    app.innerHTML = vistaExtintor(e);
    setInterval(() => { // reevalúa el estado con el reloj del dispositivo
      const [c, t] = estado(e.vencimiento, e.horaVenc), el = $("#est");
      el.className = "est " + c; el.textContent = t;
    }, 30000);
  }catch(err){
    noEnc("No se pudo cargar la información", "Revisa el enlace del QR o tu conexión e inténtalo de nuevo en unos segundos.");
  }
})();
